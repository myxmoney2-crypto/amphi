<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amphi - Prise de notes intelligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

    <header class="bg-white border-b px-6 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-indigo-600">Amphi</h1>
        <input type="password" id="apiKey" placeholder="Clé API Gemini" class="border rounded px-3 py-2 text-sm w-80">
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <!-- GAUCHE : DICTÉE VOCALE -->
        <div class="w-1/2 p-6 border-r flex flex-col">
            <h2 class="font-semibold text-gray-700 mb-3">🎤 1. Enregistrement vocal</h2>
            <textarea id="transcript" class="flex-1 border rounded-lg p-4 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Le texte apparaîtra ici pendant l'enregistrement..."></textarea>
            
            <div class="mt-4 flex gap-3">
                <button id="micBtn" onclick="toggleRecording()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium flex items-center justify-center gap-2 flex-1">
                    <span>🎤</span>
                    <span id="micText">Démarrer l'enregistrement</span>
                </button>
            </div>
            
            <button onclick="processCourse()" class="mt-3 bg-green-600 text-white px-6 py-3 rounded-lg font-medium flex items-center justify-center gap-2">
                <span></span>
                <span>Traiter avec l'IA</span>
            </button>
        </div>

        <!-- DROITE : RÉSULTAT -->
        <div class="w-1/2 p-6 flex flex-col">
            <h2 class="font-semibold text-gray-700 mb-3">📚 2. Cours structuré</h2>
            <div id="result" class="flex-1 border rounded-lg p-4 overflow-y-auto bg-white text-sm">
                <p class="text-gray-400 text-center mt-20">Le cours apparaîtra ici après traitement...</p>
            </div>
        </div>

    </main>

    <script>
        let recognition;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false; // Changé en false pour éviter les doublons en temps réel
            recognition.lang = 'fr-FR';

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    }
                }
                if (finalTranscript) {
                    const textarea = document.getElementById('transcript');
                    textarea.value += finalTranscript;
                    textarea.scrollTop = textarea.scrollHeight;
                }
            };

            recognition.onerror = (event) => {
                console.error('Erreur reconnaissance:', event.error);
            };

            recognition.onend = () => {
                if (isRecording) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 100);
                } else {
                    document.getElementById('micBtn').classList.remove('pulse', 'bg-red-600');
                    document.getElementById('micBtn').classList.add('bg-indigo-600');
                    document.getElementById('micText').textContent = 'Démarrer l\'enregistrement';
                }
            };
        } else {
            alert('Votre navigateur ne supporte pas la reconnaissance vocale. Utilisez Google Chrome.');
        }

        function toggleRecording() {
            if (!recognition) return;
            
            if (isRecording) {
                isRecording = false;
                recognition.stop();
                document.getElementById('micBtn').classList.remove('pulse', 'bg-red-600');
                document.getElementById('micBtn').classList.add('bg-indigo-600');
                document.getElementById('micText').textContent = 'Démarrer l\'enregistrement';
            } else {
                isRecording = true;
                recognition.start();
                document.getElementById('micBtn').classList.add('pulse', 'bg-red-600');
                document.getElementById('micBtn').classList.remove('bg-indigo-600');
                document.getElementById('micText').textContent = 'Arrêter l\'enregistrement';
            }
        }

        async function processCourse() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = document.getElementById('transcript').value.trim();
            
            if (!apiKey) {
                alert('️ Entre ta clé API Gemini en haut à droite');
                return;
            }
            if (!text) {
                alert('⚠️ Enregistre ou colle du texte d\'abord');
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-center text-gray-500 mt-20">⏳ Traitement en cours... (10-20 secondes)</p>';

            // PROMPT SPÉCIAL POUR GÉRER LES ÉNORMES RÉPÉTITIONS DU DICTAPHONE
            const prompt = `Tu es un expert pédagogique. Voici une transcription brute d'un cours.

ATTENTION IMPORTANTE : Le dictaphone a bugué et a répété les mêmes paragraphes des dizaines de fois. Le texte ci-dessous contient d'ÉNORMES doublons. 
TON TRAVAIL PRINCIPAL EST DE DÉDUPLIQUER : lis tout, mais ne garde qu'une SEULE occurrence de chaque idée unique. Ignore complètement les répétitions.

TRANSCRIPTION BRUTE :
"""
${text}
"""

TON TRAVAIL :
1. SUPPRIME TOUTES les répétitions (le même texte répété plusieurs fois).
2. SUPPRIME les phrases parasites : "arrêtez de faire du bruit", "j'ai besoin de calme", salutations, hésitations.
3. STRUCTURE le cours avec des titres clairs (## Titre, ### Sous-titre).
4. METS EN GRAS les termes importants.
5. GARDE UNIQUEMENT le contenu pédagogique réel.
6. CRÉE un quiz de 3 questions à la fin basé sur le cours.

Retourne le résultat en Markdown.`;

            try {
                // ✅ MODÈLE MIS À JOUR : gemini-3.8-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: 0.3,
                            maxOutputTokens: 4096 // Augmenté pour gérer les longs textes
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Erreur API (${response.status}): ${errorData.error?.message || 'Erreur inconnue'}`);
                }

                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error('Réponse API invalide.');
                }

                const markdown = data.candidates[0].content.parts[0].text;

                // Conversion Markdown en HTML
                let html = markdown
                    .replace(/^### (.+)$/gm, '<h3 class="text-lg font-bold mt-4 mb-2 text-indigo-700">$1</h3>')
                    .replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold mt-6 mb-3 text-indigo-800 border-b pb-2">$1</h2>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong class="text-gray-900">$1</strong>')
                    .replace(/\n\n/g, '</p><p class="mb-3">')
                    .replace(/\n/g, '<br>');

                resultDiv.innerHTML = `<div class="prose max-w-none">${html}</div>`;

            } catch (error) {
                console.error('Erreur complète:', error);
                resultDiv.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <p class="text-red-600 font-bold mb-2">❌ Erreur : ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
